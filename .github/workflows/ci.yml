name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  detector:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        os: [ubuntu-latest]
        include:
          # ubuntu-latest (26.04) ships no Python 3.8 build; README promises 3.8+.
          - python-version: "3.8"
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: python -I -m pytest -q
      - name: Reproduce the synthetic-corpus confusion matrix
        run: python -I evaluate_detector.py corpus_synthetic/manifest_synthetic.tsv
